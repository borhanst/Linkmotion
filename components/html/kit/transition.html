<!DOCTYPE html>
<!-- KIT: transition-wipe | beat-to-beat transition, styled by the transition gene.
     This file implements the 4 gene variants; the compose stage keeps ONLY the
     one that matches the chosen gene (or edits this comment to note the swap). -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transition</title>
<link rel="stylesheet" href="../../style/tokens.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  .stage { position:relative; z-index:1; width:100%; height:100%; overflow:hidden; }
  /* 1) accent-wipe: full panel sweeps L->R, covering the cut point */
  .wipe { position:absolute; inset:0; background:var(--accent); transform:scaleX(0);
          transform-origin:left; display:flex; align-items:center; justify-content:center; }
  .wipe .word { font-family:var(--font-display); font-size:70px; font-weight:800;
                color:var(--bg); opacity:0; }

  /* 2) zoom-punch: an oversized word scales past the camera */
  .punch { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           background:var(--bg); }
  .punch .word { font-family:var(--font-display); font-size:44px; font-weight:900; letter-spacing:.2em;
                 text-transform:uppercase; color:var(--text); }

  /* 3) slide-stack: next-scene card slides in over current */
  .stack { position:absolute; inset:0; padding:120px 90px; }
  .stack .card { height:100%; border-radius:var(--radius); background:var(--surface);
                 transform:translateY(110%); box-shadow:0 -18px 60px rgba(0,0,0,.35);
                 display:flex; align-items:center; justify-content:center;
                 font-family:var(--font-display); font-size:56px; font-weight:800; }

  /* 4) morph-dot: a dot expands into a full accent screen */
  .dotwrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
             background:var(--bg); }
  .dotwrap .dot { width:24px; height:24px; border-radius:50%; background:var(--accent); }
</style>
</head>
<body>
  <div class="motif"></div>
  <div class="stage">
    <!-- CONTENT: keep the block matching THIS video's transition gene; delete others -->
    <div class="wipe" id="wipe"><div class="word">NEXT</div></div>

    <div class="punch" id="punch"><div class="word">REPLACE · NEXT SCENE TITLE</div></div>

    <div class="stack"><div class="card" id="card">REPLACE · NEXT SCENE</div></div>

    <div class="dotwrap" id="dotwrap"><div class="dot" id="dot"></div></div>
  </div>
<script>
  // Each transition runs as: enter (cover) -> hold -> exit (reveal next beat).
  // Compose stage: keep the variant matching the transition gene, delete the rest.
  const gene = "accent-wipe";   // CONTENT: set to this video's transition gene

  if (gene === "accent-wipe") {
    gsap.timeline()
      .to("#wipe", { scaleX:1, duration:.5, ease:"power2.inOut" })
      .to("#wipe .word", { opacity:1, duration:.25, ease:"power2.out" }, "-=.15")
      .to("#wipe .word", { opacity:0, duration:.2 }, "+=.6")
      .to("#wipe", { scaleX:0, transformOrigin:"right", duration:.5, ease:"power2.inOut" }, "-=.05");

  } else if (gene === "zoom-punch") {
    gsap.timeline()
      .fromTo("#punch .word", { scale:.2, opacity:0 }, { scale:3.2, opacity:1, duration:.9,
        ease:"power3.in", transformOrigin:"50% 50%" })
      .to("#punch", { opacity:0, duration:.3, ease:"power2.out" });

  } else if (gene === "slide-stack") {
    gsap.timeline()
      .to("#card", { y:0, duration:.65, ease:"power3.out" })
      .to("#card", { y:"-12%", opacity:.0, duration:.4, ease:"power2.in", delay:.8 });

  } else { // morph-dot
    gsap.timeline()
      .to("#dot", { scale:180, duration:.7, ease:"power3.inOut" })
      .to("#dotwrap", { opacity:0, duration:.4, ease:"power2.out", delay:.5 });
  }
</script>
</body>
</html>
