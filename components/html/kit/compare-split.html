<!DOCTYPE html>
<!-- KIT: compare-split | two stacked panels, winner pulses once -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compare Split</title>
<link rel="stylesheet" href="../../../style/tokens.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  .stage { position:relative; z-index:1; width:100%; height:100%;
           display:flex; flex-direction:column; justify-content:center; gap:36px; padding:0 90px; }
  .kicker { font-size:28px; letter-spacing:.26em; text-transform:uppercase;
            color:var(--accent2); font-weight:700; text-align:center; opacity:0; }
  .panel { border-radius:var(--radius); padding:64px 40px; text-align:center;
           background:var(--surface); font-size:52px; font-weight:800;
           font-family:var(--font-display); opacity:0; }
  .panel.winner { background:var(--accent); color:var(--bg); position:relative; overflow:hidden; }
  .panel small { display:block; font-family:var(--font-ui); font-size:30px; font-weight:500;
                 margin-top:16px; opacity:.75; }
  .pct { position:absolute; top:26px; right:30px; font-size:30px; font-weight:800; opacity:0; }
</style>
</head>
<body>
  <div class="motif"></div>
  <div class="stage">
    <!-- CONTENT START -->
    <div class="kicker">BEFORE vs AFTER</div>
    <div class="panel">OLD<span small>replace with the old reality</span>
      <div class="pct">-40%</div>
    </div>
    <div class="panel winner">NEW<small>replace with the new reality</small>
      <div class="pct">+2x</div>
    </div>
    <!-- CONTENT END -->
  </div>
<script>
  const EASE = "back.out(1.7)";
  const tl = gsap.timeline();
  tl.from(".kicker",   { duration:.5, opacity:0, y:24, ease:EASE })
    .to(".panel:not(.winner)", { duration:.6, opacity:1, x:0, ease:EASE, startAt:{ x:-70 } })
    .to(".panel.winner",       { duration:.7, opacity:1, x:0, ease:EASE, startAt:{ x:70 } }, "-=.35")
    .to(".panel.winner",  { scale:1.02, duration:.22, yoyo:true, repeat:1, ease:"power2.inOut" }, "+=.3")
    .from(".panel.winner .pct", { duration:.5, opacity:0, scale:.5, ease:EASE }, "-=.35")
    .set(".panel:not(.winner) .pct", { opacity:.6 });
</script>
</body>
</html>
