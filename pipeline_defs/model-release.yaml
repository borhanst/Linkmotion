name: model-release
version: "1.0"
description: >
  60-120s new LLM / model-release announcement explainer. Reads the lab's own
  announcement post, model card, pricing, and benchmarks; narrates the story
  over real page captures. 16:9 by default; Shorts variant uses 9:16.
category: generated
stability: production

default_checkpoint_policy: guided

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/model-release/executive-producer
  - pipelines/model-release/research-director
  - pipelines/model-release/proposal-director
  - pipelines/model-release/script-director
  - pipelines/model-release/storyboard-director
  - pipelines/model-release/asset-director
  - pipelines/model-release/compose-director
  - pipelines/model-release/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/onboarding

orchestration:
  mode: executive-producer
  skill: pipelines/model-release/executive-producer
  budget_default_usd: 0.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 20

compatible_playbooks:
  recommended:
    - flat-motion-graphics
    - clean-professional
  also_works:
    - minimalist-diagram
  custom_allowed: true

stages:
  - name: research
    skill: pipelines/model-release/research-director
    produces:
      - research_brief
    tools_available:
      - web_search
      - youtube_source
      - broll
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Announcement post identified as primary source
      - Model card / system card fetched
      - Pricing page fetched
      - Benchmarks table located (vendor-reported flagged)
      - Publication date recorded
    success_criteria:
      - "research_brief has >= 3 data_points with URLs"
      - primary_source is set
      - model_name spelled exactly as on the page

  - name: proposal
    skill: pipelines/model-release/proposal-director
    required_artifacts_in:
      - research_brief
    produces:
      - proposal_packet
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Angle grounded in a specific research finding
      - Concept options differentiated (honest catch vs. hype)
      - Duration inside 60-120s
    success_criteria:
      - "proposal_packet has >= 1 concept_option"
      - approval.status is "approved" or "approved_with_changes"

  - name: script
    skill: pipelines/model-release/script-director
    required_artifacts_in:
      - proposal_packet
    optional_artifacts_in:
      - research_brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook in first 5s
      - "Beats: hook -> announcement -> what's new -> benchmarks -> pricing & availability -> how to try -> verdict"
      - Vendor claims attributed; independent benchmarks flagged
      - Numbers pronounced as spoken ("GPT five point five")
    success_criteria:
      - script has 6-9 beats
      - total_duration_sec inside 60-120

  - name: storyboard
    skill: pipelines/model-release/storyboard-director
    required_artifacts_in:
      - script
    produces:
      - storyboard
    tools_available:
      - browser_capture
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - "card open -> 3-6 web scenes -> card verdict"
      - Every anchor verbatim from inspect_page.py output
      - Benchmarks table spotlighted; vendor vs independent flagged on screen
      - Pricing row spotlighted; units named
      - Sources + date in verdict footer
    success_criteria:
      - storyboard schema-valid
      - ">= 3 scene types used"
      - verdict card has footer with sources

  - name: assets
    skill: pipelines/model-release/asset-director
    required_artifacts_in:
      - storyboard
    optional_artifacts_in:
      - script
    produces:
      - asset_manifest
    required_tools:
      - tts
    optional_tools:
      - browser_capture
    tools_available:
      - tts
      - browser_capture
      - broll
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - All asset files exist
      - Narration covers every beat
      - Word-level timestamps present
    success_criteria:
      - asset_manifest schema-valid
      - every beat has audio

  - name: compose
    skill: pipelines/model-release/compose-director
    required_artifacts_in:
      - storyboard
      - asset_manifest
    produces:
      - render_report
    required_tools:
      - video_compose
    tools_available:
      - video_compose
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Output exists and plays
      - Duration inside 60-120s
      - Captions word-synced
      - Aspect ratio matches proposal (16:9 default, 9:16 for Shorts variant)
    success_criteria:
      - render_report valid
      - ffprobe duration inside 60-120s

  - name: publish
    skill: pipelines/model-release/publish-director
    required_artifacts_in:
      - render_report
    produces:
      - publish_log
    tools_available:
      - metadata
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Title front-loaded with exact model name
      - Description includes date, lab, model string, sources
      - Hashtags appropriate
    success_criteria:
      - publish_log schema-valid
      - metadata package present
